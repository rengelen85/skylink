[project]
name = "skylink-dataset-validation"
version = "0.1.0"
description = "Repeatable validation suite for the SkyLink Airways synthetic dataset"
requires-python = ">=3.10"
dependencies = ["polars>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["regen: re-runs the generator in a temp dir (slow, enable with --regen)"]
